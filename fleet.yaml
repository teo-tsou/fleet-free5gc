defaultNamespace: free5gc
name: free5gc

dependsOn:
  - name: gtp5g-installer
  - name: multus-cni

helm:
  chart: charts
  releaseName: free5gc
  valuesFiles:
    - values.yaml
  values:
    mcp:
      # the platform's key for this cluster, published by the platform on the cluster's Fleet object (MCP tool calls)
      platformKey: ${ .ClusterValues.platformMcpKey }
